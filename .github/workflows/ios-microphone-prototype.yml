name: Native iPhone microphone prototype

on:
  workflow_dispatch:
  push:
    paths:
      - 'ios/**'
      - 'tests/shared-audio-project.py'
      - 'tests/whatsapp-audio.test.cjs'
      - 'tests/native-transcript-state.swift'
      - 'tests/run-native-transcript-state.py'
      - 'tests/native-audio-stats.swift'
      - 'tests/run-native-audio-stats.py'
      - '.github/workflows/ios-microphone-prototype.yml'
  pull_request:
    paths:
      - 'ios/**'
      - 'tests/shared-audio-project.py'
      - 'tests/whatsapp-audio.test.cjs'
      - 'tests/native-transcript-state.swift'
      - 'tests/run-native-transcript-state.py'
      - 'tests/native-audio-stats.swift'
      - 'tests/run-native-audio-stats.py'
      - '.github/workflows/ios-microphone-prototype.yml'

permissions:
  contents: read

concurrency:
  group: native-microphone-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Verify shared audio and target configuration
        run: |
          node --test tests/whatsapp-audio.test.cjs
          python3 tests/shared-audio-project.py
      - name: Verify native phrase accumulation
        run: python3 tests/run-native-transcript-state.py
      - name: Verify converted audio and queue diagnostics
        run: python3 tests/run-native-audio-stats.py
      - name: Compile without signing or installing
        run: >-
          xcodebuild -project ios/HablaEcuador.xcodeproj
          -scheme HablaEcuador -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -configuration Debug -derivedDataPath /tmp/habla-ios-build
          CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO build

      - name: Archive for iPhone without signing
        run: >-
          xcodebuild -project ios/HablaEcuador.xcodeproj
          -scheme HablaEcuador -sdk iphoneos
          -destination 'generic/platform=iOS'
          -configuration Release -derivedDataPath /tmp/habla-ios-device
          -archivePath /tmp/HablaEcuador.xcarchive
          CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO archive
      - name: Verify embedded iPhone extensions
        run: |
          test -f /tmp/HablaEcuador.xcarchive/Products/Applications/HablaEcuador.app/Info.plist
          test -f /tmp/HablaEcuador.xcarchive/Products/Applications/HablaEcuador.app/PlugIns/HablaEcuadorShare.appex/Info.plist
          test -f /tmp/HablaEcuador.xcarchive/Products/Applications/HablaEcuador.app/PlugIns/HablaEcuadorWidget.appex/Info.plist
          ditto -c -k --sequesterRsrc --keepParent /tmp/HablaEcuador.xcarchive /tmp/HablaEcuador-iPhone-unsigned.zip
      - name: Save unsigned iPhone archive
        uses: actions/upload-artifact@v4
        with:
          name: HablaEcuador-iPhone-unsigned-${{ github.run_number }}
          path: /tmp/HablaEcuador-iPhone-unsigned.zip
          if-no-files-found: error
          retention-days: 14
      - name: Explain installation status
        run: |
          echo 'iPhone archive built with app, Share extension, and widget. This archive is unsigned; installation and TestFlight distribution require the existing Apple Developer signing setup on the Mac.' >> "$GITHUB_STEP_SUMMARY"
