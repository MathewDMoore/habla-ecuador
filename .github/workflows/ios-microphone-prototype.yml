name: Native iPhone microphone prototype

on:
  workflow_dispatch:
  push:
    paths:
      - 'ios/**'
      - 'tests/native-transcript-state.swift'
      - 'tests/run-native-transcript-state.py'
      - 'tests/native-audio-stats.swift'
      - 'tests/run-native-audio-stats.py'
      - '.github/workflows/ios-microphone-prototype.yml'
  pull_request:
    paths:
      - 'ios/**'
      - 'tests/native-transcript-state.swift'
      - 'tests/run-native-transcript-state.py'
      - 'tests/native-audio-stats.swift'
      - 'tests/run-native-audio-stats.py'
      - '.github/workflows/ios-microphone-prototype.yml'

permissions:
  contents: read

concurrency:
  group: native-microphone-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Select an iOS 27 SDK for system-audio compilation
        run: |
          python3 - <<'PY'
          import glob, os, subprocess
          candidates = sorted(glob.glob('/Applications/Xcode*.app/Contents/Developer'), reverse=True)
          for candidate in candidates:
              environment = dict(os.environ, DEVELOPER_DIR=candidate)
              version = subprocess.run(['xcrun', '--sdk', 'iphonesimulator', '--show-sdk-version'], env=environment, capture_output=True, text=True)
              try:
                  supported = version.returncode == 0 and int(version.stdout.strip().split('.')[0]) >= 27
              except ValueError:
                  supported = False
              if supported:
                  with open(os.environ['GITHUB_ENV'], 'a') as output:
                      output.write('DEVELOPER_DIR=' + candidate + '\n')
                  print('Selected simulator SDK ' + version.stdout.strip())
                  break
          else:
              raise SystemExit('No iOS 27 SDK is installed on this runner. System-audio code has NOT been compile-validated; build it with Xcode 27 on a Mac.')
          PY
      - name: Verify native phrase accumulation
        run: python3 tests/run-native-transcript-state.py
      - name: Verify converted audio and queue diagnostics
        run: python3 tests/run-native-audio-stats.py
      - name: Compile without signing or installing
        run: >-
          xcodebuild -project ios/HablaEcuador.xcodeproj
          -scheme HablaEcuador -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -configuration Debug -derivedDataPath /tmp/habla-ios-build
          CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO build
