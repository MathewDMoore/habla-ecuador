name: English voice exchange pilot

on:
  pull_request:
    paths:
      - 'english-voice-lab.js'
      - 'app.js'
      - 'index.html'
      - 'translator.html'
      - 'sw.js'
      - 'app-version.json'
      - 'tests/english-voice-lab.test.cjs'
      - 'tests/english-country-flags.test.cjs'
      - 'tests/english-practice-regions.test.cjs'
      - 'quick-lessons.js'
      - 'recorded-practice.js'
      - 'regional-lesson-evaluator.js'
      - 'data/ecuador-bolivia-comparisons-v1.json'
      - 'data/learner-entries-v1.json'
      - 'data/sources.json'
      - 'data/regional-evidence-reviews-v1.json'
      - 'data/regional-lesson-proposals-v1.json'
      - 'scripts/evaluate-regional-lessons.cjs'
      - 'tests/regional-lesson-evaluator.test.cjs'
      - '.github/workflows/english-voice-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  voice-exchange:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: node --check english-voice-lab.js && node --check app.js && node --check quick-lessons.js && node --check recorded-practice.js && node --check sw.js && node --check regional-lesson-evaluator.js
      - run: node --test tests/english-voice-lab.test.cjs tests/english-country-flags.test.cjs tests/english-practice-regions.test.cjs tests/dictionary-practice.test.cjs tests/regional-lesson-evaluator.test.cjs
      - run: node scripts/evaluate-regional-lessons.cjs --check
      - run: node scripts/evaluate-regional-lessons.cjs --output=regional-lesson-review-artifact.json
      - uses: actions/upload-artifact@v4
        with:
          name: regional-lesson-proposals
          path: regional-lesson-review-artifact.json
          if-no-files-found: error
