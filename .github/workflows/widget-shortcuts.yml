name: Habla Ecuador widget shortcuts

on:
  pull_request:
    paths:
      - 'ios/**'
      - 'app.js'
      - 'tests/widget*'
      - '.github/workflows/widget-shortcuts.yml'
  push:
    paths:
      - 'ios/**'
      - 'app.js'
      - 'tests/widget*'
      - '.github/workflows/widget-shortcuts.yml'

permissions:
  contents: read

jobs:
  shortcuts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: node --test tests/widget-design.test.cjs
      - run: npm install --prefix "$RUNNER_TEMP/habla-widget-browser" --no-package-lock --no-save playwright@1.62.1
      - run: node "$RUNNER_TEMP/habla-widget-browser/node_modules/playwright/cli.js" install --with-deps --only-shell ${{ matrix.engine }}
      - run: node tests/widget-deep-links.browser.cjs
        env:
          HABLA_PLAYWRIGHT_MODULE: ${{ runner.temp }}/habla-widget-browser/node_modules/playwright
          HABLA_BROWSER_ENGINE: ${{ matrix.engine }}
