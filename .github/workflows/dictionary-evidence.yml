name: Dictionary evidence checks

on:
  push:
    branches: [main, 'dictionary-evidence-*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dictionary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source claims and independent review states
        run: node scripts/check-regional-evidence.cjs
      - name: Verify regional meanings, filters and preserved vocabulary
        run: node --test tests/regional-evidence.test.cjs tests/regional-sources.test.cjs tests/dictionary-source-loading.test.cjs tests/regional-vocabulary.test.cjs tests/regional-usage.test.cjs tests/spanish-context.test.cjs tests/dictionary-recovery.test.cjs

