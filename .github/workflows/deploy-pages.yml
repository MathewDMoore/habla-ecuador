name: Deploy Habla Ecuador to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify five-tab swipe gestures
        run: node --test tests/swipe-navigation.test.cjs

      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check swipe-navigation.js
          node --check tests/navigation-browser-smoke.cjs

      - name: Install WebKit browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/habla-browser" --no-package-lock --no-save playwright@1.62.1
          node "$RUNNER_TEMP/habla-browser/node_modules/playwright/cli.js" install --with-deps webkit

      - name: Verify five-tab navigation in WebKit
        run: node tests/navigation-browser-smoke.cjs
        env:
          HABLA_PLAYWRIGHT_MODULE: ${{ runner.temp }}/habla-browser/node_modules/playwright
          HABLA_BROWSER_ENGINE: webkit

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare public site
        env:
          PAGES_DIR: ${{ runner.temp }}/habla-pages
        run: |
          mkdir -p "$PAGES_DIR"
          git archive HEAD | tar -xf - -C "$PAGES_DIR"
          node scripts/share-archived-audio.cjs "$PAGES_DIR"
          node "$PAGES_DIR/scripts/write-release.cjs"

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/habla-pages
          name: github-pages-${{ github.run_attempt }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
