name: Deploy Habla Ecuador to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Validate dictionary evidence before publishing
        run: |
          node scripts/check-regional-evidence.cjs
          node --test tests/regional-evidence.test.cjs tests/regional-sources.test.cjs tests/dictionary-source-loading.test.cjs tests/regional-vocabulary.test.cjs tests/regional-usage.test.cjs tests/spanish-context.test.cjs tests/dictionary-recovery.test.cjs

      - name: Generate public release metadata
        run: node scripts/write-release.cjs

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

