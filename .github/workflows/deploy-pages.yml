name: Deploy Habla Ecuador to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare public site
        env:
          PAGES_DIR: ${{ runner.temp }}/habla-pages
        run: |
          mkdir -p "$PAGES_DIR"
          git archive HEAD | tar -xf - -C "$PAGES_DIR"
          node scripts/share-archived-audio.cjs "$PAGES_DIR"
          node "$PAGES_DIR/scripts/write-release.cjs"

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/habla-pages
          name: github-pages-${{ github.run_attempt }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
