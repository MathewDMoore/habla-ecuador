name: Deploy Habla Ecuador to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_run:
    workflows: [Verify Habla candidate]
    types: [completed]
    branches: [release/verified-preview-20261125]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify five-tab swipe gestures
        run: node --test tests/swipe-navigation.test.cjs

      - name: Verify Bolivian vocabulary and source attribution
        run: node --test tests/bolivia-reference-pack.test.cjs tests/regional-vocabulary.test.cjs tests/regional-usage.test.cjs tests/regional-sources.test.cjs tests/spanish-context.test.cjs

      - name: Verify both shared YouTube embeds and learning-source evidence
        run: node --test tests/embedded-shared-videos.test.cjs tests/shared-learning-links.test.cjs tests/youtube-share-player.test.cjs

      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check swipe-navigation.js
          node --check tests/navigation-browser-smoke.cjs
          node --check app-feedback.js
          node --check tutorial.js
          node --check tests/pending-feedback.browser.cjs

      - name: Install WebKit browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/habla-browser" --no-package-lock --no-save playwright@1.62.1
          node "$RUNNER_TEMP/habla-browser/node_modules/playwright/cli.js" install --with-deps webkit

      - name: Verify five-tab navigation in WebKit
        run: node tests/navigation-browser-smoke.cjs
        env:
          HABLA_PLAYWRIGHT_MODULE: ${{ runner.temp }}/habla-browser/node_modules/playwright
          HABLA_BROWSER_ENGINE: webkit

      - name: Verify native-speaker pending review in WebKit
        run: node tests/pending-feedback.browser.cjs
        env:
          HABLA_PLAYWRIGHT_MODULE: ${{ runner.temp }}/habla-browser/node_modules/playwright
          HABLA_BROWSER_ENGINE: webkit

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare public site
        env:
          PAGES_DIR: ${{ runner.temp }}/habla-pages
        run: |
          mkdir -p "$PAGES_DIR"
          git archive HEAD | tar -xf - -C "$PAGES_DIR"
          node scripts/share-archived-audio.cjs "$PAGES_DIR"
          node "$PAGES_DIR/scripts/write-release.cjs"

      - name: Select the verified preview commit
        id: preview
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          node --input-type=module <<'NODE'
          import {appendFileSync} from 'node:fs';
          let sha=process.env.CANDIDATE_SHA;
          if (!sha) {
            const repository=process.env.GITHUB_REPOSITORY;
            const url=`https://api.github.com/repos/${repository}/actions/runs?branch=release%2Fverified-preview-20261125&event=push&status=success&per_page=100`;
            const response=await fetch(url,{headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json'}});
            if (!response.ok) throw Error(`Preview verification lookup failed (${response.status}).`);
            const data=await response.json();
            sha=data.workflow_runs.find(run=>run.name==='Verify Habla candidate' && run.head_repository.full_name===repository)?.head_sha;
          }
          if (sha) {
            if (!/^[a-f0-9]{40}$/.test(sha)) throw Error('Invalid candidate commit.');
            appendFileSync(process.env.GITHUB_OUTPUT,`sha=${sha}\n`);
          }
          NODE

      - name: Include the isolated tested preview
        if: steps.preview.outputs.sha != ''
        env:
          PAGES_DIR: ${{ runner.temp }}/habla-pages
          CANDIDATE_SHA: ${{ steps.preview.outputs.sha }}
        run: |
          git fetch --depth=1 origin "$CANDIDATE_SHA"
          mkdir -p "$PAGES_DIR/preview/integration"
          git archive "$CANDIDATE_SHA" | tar -xf - -C "$PAGES_DIR/preview/integration"
          node "$PAGES_DIR/preview/integration/scripts/write-release.cjs"
          node "$PAGES_DIR/preview/integration/scripts/prepare-preview.cjs" "$PAGES_DIR/preview/integration"
          rm -rf "$PAGES_DIR/preview/integration/versions" "$PAGES_DIR/preview/integration/ios" "$PAGES_DIR/preview/integration/.github" "$PAGES_DIR/preview/integration/tests"
          touch "$PAGES_DIR/.nojekyll"

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/habla-pages
          name: github-pages-${{ github.run_attempt }}

  deploy:
    name: Publish verified Habla site
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
