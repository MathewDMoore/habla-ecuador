name: Practice microphone regressions

on:
  pull_request:
    paths:
      - 'app.js'
      - 'styles.css'
      - 'interface-*.js'
      - 'tests/*practice*'
      - 'tests/dictionary-startup.browser.cjs'
      - '.github/workflows/practice-browser.yml'

permissions:
  contents: read

jobs:
  practice:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: node --test tests/*.test.cjs
      - run: npm install --prefix "$RUNNER_TEMP/habla-browser" --no-package-lock --no-save playwright@1.62.1
      - run: node "$RUNNER_TEMP/habla-browser/node_modules/playwright/cli.js" install --with-deps ${{ matrix.engine }}
      - run: node tests/dictionary-practice.browser.cjs
        env:
          HABLA_PLAYWRIGHT_MODULE: ${{ runner.temp }}/habla-browser/node_modules/playwright
          HABLA_NATIVE_SCRIPT: ${{ github.workspace }}/ios/HablaEcuador/NativeSpeech.js
          HABLA_BROWSER_ENGINE: ${{ matrix.engine }}
      - run: node tests/dictionary-startup.browser.cjs
        env:
          HABLA_PLAYWRIGHT_MODULE: ${{ runner.temp }}/habla-browser/node_modules/playwright
          HABLA_BROWSER_ENGINE: ${{ matrix.engine }}
