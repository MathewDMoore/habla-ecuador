name: Practice microphone regressions

on:
  pull_request:
    paths:
      - 'app.js'
      - 'ios/HablaEcuador/NativeSpeech.js'
      - 'tests/native-audio-ui.browser.cjs'
      - 'tutorial.js'
      - 'music-song.js'
      - 'whatsapp-audio.js'
      - 'tests/music-song.browser.cjs'
      - 'full-text-reader.js'
      - 'tests/full-text-reader.browser.cjs'
      - 'tests/tutorial*'
      - 'quick-lessons.js'
      - 'styles.css'
      - 'index.html'
      - 'translator.html'
      - 'tests/translation-copy.browser.cjs'
      - 'interface-*.js'
      - 'tests/*practice*'
      - 'tests/*lesson*'
      - 'tests/dictionary-startup.browser.cjs'
      - '.github/workflows/practice-browser.yml'

permissions:
  contents: read

jobs:
  practice:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: node --test tests/*.test.cjs
      - run: npm install --prefix "$RUNNER_TEMP/habla-browser" --no-package-lock --no-save playwright@1.62.1
      - run: node "$RUNNER_TEMP/habla-browser/node_modules/playwright/cli.js" install --with-deps --only-shell ${{ matrix.engine }}
      # Verify touch activation in both pages and the native speech bridge.
      - run: node tests/lesson-actions.browser.cjs
        env:
          DEBUG: pw:browser
          HABLA_PLAYWRIGHT_MODULE: ${{ runner.temp }}/habla-browser/node_modules/playwright
          HABLA_BROWSER_ENGINE: ${{ matrix.engine }}
      - run: node tests/music-song.browser.cjs
        env:
          HABLA_PLAYWRIGHT_MODULE: ${{ runner.temp }}/habla-browser/node_modules/playwright
          HABLA_BROWSER_ENGINE: ${{ matrix.engine }}
          HABLA_VERIFY_REMOTE_AUDIO: '1'
      - run: node tests/native-audio-ui.browser.cjs
        env:
          HABLA_PLAYWRIGHT_MODULE: ${{ runner.temp }}/habla-browser/node_modules/playwright
          HABLA_BROWSER_ENGINE: ${{ matrix.engine }}
      - run: node tests/places.browser.cjs
        env:
          HABLA_PLAYWRIGHT_MODULE: ${{ runner.temp }}/habla-browser/node_modules/playwright
          HABLA_BROWSER_ENGINE: ${{ matrix.engine }}
      - run: node tests/conversation-profiles.browser.cjs
        env:
          HABLA_PLAYWRIGHT_MODULE: ${{ runner.temp }}/habla-browser/node_modules/playwright
          HABLA_BROWSER_ENGINE: ${{ matrix.engine }}
      - run: node tests/tutorial.browser.cjs
        env:
          HABLA_PLAYWRIGHT_MODULE: ${{ runner.temp }}/habla-browser/node_modules/playwright
          HABLA_BROWSER_ENGINE: ${{ matrix.engine }}
      - run: node tests/tutorial-zoom.browser.cjs
        if: matrix.engine == 'chromium'
        env:
          HABLA_PLAYWRIGHT_MODULE: ${{ runner.temp }}/habla-browser/node_modules/playwright
      - run: node tests/translator-microphone.browser.cjs
        env:
          HABLA_PLAYWRIGHT_MODULE: ${{ runner.temp }}/habla-browser/node_modules/playwright
          HABLA_NATIVE_SCRIPT: ${{ github.workspace }}/ios/HablaEcuador/NativeSpeech.js
          HABLA_BROWSER_ENGINE: ${{ matrix.engine }}
      # Verify the reported Copy interaction before the broader lesson suites.
      - run: node tests/full-text-reader.browser.cjs
        env:
          HABLA_PLAYWRIGHT_MODULE: ${{ runner.temp }}/habla-browser/node_modules/playwright
          HABLA_BROWSER_ENGINE: ${{ matrix.engine }}
      - run: node tests/translation-copy.browser.cjs
        env:
          HABLA_PLAYWRIGHT_MODULE: ${{ runner.temp }}/habla-browser/node_modules/playwright
          HABLA_BROWSER_ENGINE: ${{ matrix.engine }}
      - run: node tests/language-community.browser.cjs
        env:
          HABLA_PLAYWRIGHT_MODULE: ${{ runner.temp }}/habla-browser/node_modules/playwright
          HABLA_BROWSER_ENGINE: ${{ matrix.engine }}
      - run: node tests/dictionary-practice.browser.cjs
        env:
          HABLA_PLAYWRIGHT_MODULE: ${{ runner.temp }}/habla-browser/node_modules/playwright
          HABLA_NATIVE_SCRIPT: ${{ github.workspace }}/ios/HablaEcuador/NativeSpeech.js
          HABLA_BROWSER_ENGINE: ${{ matrix.engine }}
      - run: node tests/dictionary-startup.browser.cjs
        env:
          DEBUG: pw:browser
          HABLA_PLAYWRIGHT_MODULE: ${{ runner.temp }}/habla-browser/node_modules/playwright
          HABLA_BROWSER_ENGINE: ${{ matrix.engine }}
      - run: node tests/bilingual-lesson.browser.cjs
        env:
          DEBUG: pw:browser
          HABLA_PLAYWRIGHT_MODULE: ${{ runner.temp }}/habla-browser/node_modules/playwright
          HABLA_NATIVE_SCRIPT: ${{ github.workspace }}/ios/HablaEcuador/NativeSpeech.js
          HABLA_BROWSER_ENGINE: ${{ matrix.engine }}
      - run: node tests/quick-lesson.browser.cjs
        env:
          HABLA_PLAYWRIGHT_MODULE: ${{ runner.temp }}/habla-browser/node_modules/playwright
          HABLA_BROWSER_ENGINE: ${{ matrix.engine }}
      - run: node tests/video-lesson.browser.cjs
        env:
          HABLA_PLAYWRIGHT_MODULE: ${{ runner.temp }}/habla-browser/node_modules/playwright
          HABLA_NATIVE_SCRIPT: ${{ github.workspace }}/ios/HablaEcuador/NativeSpeech.js
          HABLA_BROWSER_ENGINE: ${{ matrix.engine }}
